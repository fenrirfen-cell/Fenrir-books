<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Fenrir Books</title><meta name="fenrir-link-collection" content="allowed">
<style>
:root{color-scheme:dark;--gold:#d8b56c;--muted:#a49c91;--line:#3f3528}*{box-sizing:border-box}body{margin:0;background:#0e0d0f;color:#f4f0e8;font:15px system-ui,sans-serif}header,main{max-width:1080px;margin:auto;padding:24px}header{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.brand{letter-spacing:3px;font-size:17px;font-weight:700;color:var(--gold)}small,.muted{color:var(--muted)}.hero{padding:44px 0 25px}h1{font:clamp(38px,7vw,72px) Georgia,serif;margin:8px 0 12px;letter-spacing:-2px}h2{font:28px Georgia,serif}input{width:100%;background:#1a181b;border:1px solid var(--line);border-radius:10px;padding:15px;color:white;font:inherit}button,.download-link{display:inline-block;text-decoration:none;background:var(--gold);color:#16100a;border:none;padding:11px 16px;border-radius:7px;font-weight:700;cursor:pointer}button:disabled{opacity:.45;cursor:default}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:16px}.book,.queue{background:#171518;border:1px solid var(--line);border-radius:14px;padding:18px}.cover{height:180px;background:linear-gradient(145deg,#442f1a,#171015 75%);border:1px solid #6a5032;border-radius:4px;box-shadow:inset 8px 0 #211b19;display:grid;place-items:center;padding:18px;text-align:center;color:var(--gold);font:26px Georgia,serif}.book h3{margin:15px 0 4px}.book p{line-height:1.5}.actions{display:flex;gap:8px;flex-wrap:wrap}.queue{margin-top:18px}.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 0;border-bottom:1px solid var(--line)}.row span:first-child{flex:1;min-width:130px}progress{accent-color:var(--gold);width:110px}footer{margin-top:40px;color:var(--muted);font-size:13px}@media(max-width:480px){header,main{padding:18px}.hero{padding-top:22px}.grid{grid-template-columns:1fr}}
</style></head><body><header><div class="brand">◈ FENRIR BOOKS</div><small>LIBRARY / 01</small></header><main><section class="hero"><small>YOUR PERSONAL ARCHIVE</small><h1>Discover your next story.</h1><p class="muted">Browse your authorized digital library and save books for offline reading.</p></section><input id="search" placeholder="Search titles or authors…" aria-label="Search books"><h2>Library</h2><p id="error" role="status"></p><div class="grid" id="books"></div><h2>Download queue</h2><div class="queue" id="queue"><span class="muted">No downloads yet.</span></div><footer>Fenrir Books · EPUB / PDF · Personal library</footer></main>
<script>
const $=id=>document.getElementById(id), jobs=new Map();let catalog=[];
function el(tag,text,cls){const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(cls)e.className=cls;return e;}
function render(){const q=$('search').value.toLowerCase();$('books').replaceChildren();for(const b of catalog.filter(b=>[b.title,b.author,b.description].join(' ').toLowerCase().includes(q))){const card=el('article',undefined,'book');card.append(el('div',b.title,'cover'),el('h3',b.title),el('small',b.author),el('p',b.description),el('p',b.license,'muted'));const a=el('div',undefined,'actions');for(const f of b.formats){const btn=el('a','Download '+f.format.toUpperCase(),'download-link');btn.href=f.downloadUrl;btn.dataset.fenrirDownload='allowed';btn.dataset.fenrirFormat=f.format.toUpperCase();btn.onclick=e=>{e.preventDefault();enqueue(b,f);};a.append(btn);}card.append(a);$('books').append(card);}if(!$('books').children.length)$('books').append(el('p','No matching books.','muted'));}
function enqueue(b,f){const key=b.id+':'+f.format;if(jobs.has(key))return;const j={key,b,f,state:'Queued',progress:0};jobs.set(key,j);draw();run();}
let busy=false;
function draw(){const q=$('queue');q.replaceChildren();for(const j of jobs.values()){const row=el('div',undefined,'row');const p=el('progress');p.max=100;p.value=j.progress;row.append(el('span',j.b.title+' · '+j.f.format.toUpperCase()),el('small',j.state),p);if(j.state==='Failed'){const retry=el('button','Retry');retry.onclick=()=>{j.state='Queued';j.progress=0;draw();run()};row.append(retry);}q.append(row);}}
async function run(){if(busy)return;busy=true;try{for(;;){const j=[...jobs.values()].find(j=>j.state==='Queued');if(!j)break;j.state='Downloading';draw();try{const r=await fetch(j.f.downloadUrl);if(!r.ok)throw Error();const total=Number(r.headers.get('content-length'));const reader=r.body.getReader();let chunks=[],received=0;for(;;){const {done,value}=await reader.read();if(done)break;chunks.push(value);received+=value.length;if(total)j.progress=Math.min(99,Math.round(received/total*100));draw();}const blob=new Blob(chunks,{type:r.headers.get('content-type')});const url=URL.createObjectURL(blob);const a=el('a');a.href=url;a.download=j.b.id+'.'+j.f.format;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);j.progress=100;j.state='Completed';}catch{j.state='Failed'}draw();}}finally{busy=false;}}
$('search').addEventListener('input',render);fetch('/api/v1/books').then(r=>{if(!r.ok)throw Error();return r.json()}).then(r=>{catalog=r.books;render()}).catch(()=>$('error').textContent='Could not load the library. Reload to retry.');
</script></body></html>
