name: Build Fenrir Books APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle --no-daemon :app:assembleRelease :app:lintRelease
      - run: cp app/build/outputs/apk/release/app-release.apk Fenrir-Books.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Fenrir-Books
          path: Fenrir-Books.apk
          if-no-files-found: error
