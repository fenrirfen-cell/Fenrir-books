name: Build Fenrir Books APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check installed Android SDK
        run: |
          test -d "$ANDROID_HOME/platforms/android-35" || sdkmanager "platforms;android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0" || sdkmanager "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle --no-daemon :app:assembleRelease :app:lintRelease
      - run: cp app/build/outputs/apk/release/app-release.apk Fenrir-Books.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Fenrir-Books
          path: Fenrir-Books.apk
          if-no-files-found: error
